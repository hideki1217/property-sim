[project]
name = "property-sim"
version = "0.1.0"
description = "日本の不動産投資の収支シミュレータ"
readme = "README.md"
authors = [
    { name = "hideki.okumura", email = "okumurahidekikangeki@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sim = "property_sim.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = "test_*.py"
python_functions = "test_*"